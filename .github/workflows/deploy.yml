name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar Build do Projeto
        run: npm run build

      - name: Criar arquivo .htaccess na pasta gerada
        run: |
          # Garante que a pasta de saída existe
          mkdir -p .output/public

          # Cria o .htaccess diretamente dentro da pasta .output/public
          cat << 'EOF' > .output/public/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-l
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Enviar para Hostinger via LFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
          set ftp:ssl-allow no;
          open -u ${{ secrets.FTP_USERNAME }},'${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};
          mirror --reverse --delete --verbose --no-perms ./.output/public/ /public_html/;
          quit;
          "
