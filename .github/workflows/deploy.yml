name: Deploy Lovable Site to Hostinger Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write # Garante que o robô pode criar a nova branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências e Compilar
        run: |
          npm install
          # Se o build gerar 'build' em vez de 'dist', renomeamos para garantir
          npm run build --if-present
          if [ -d "build" ]; then mv build dist; fi 

      - name: Enviar pasta DIST para branch de Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: hostinger-deploy
          folder: dist
          clean: true
