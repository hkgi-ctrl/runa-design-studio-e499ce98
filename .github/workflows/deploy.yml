name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar Build
        run: npm run build

      - name: Injetar index.html e .htaccess na pasta final
        run: |
          # Procura a pasta publica de saida
          if [ -d ".output/public" ]; then
            DIR=".output/public"
          elif [ -d "dist" ]; then
            DIR="dist"
          else
            DIR="."
          fi

          # Se o index.html não existir na pasta, procura em todo o repositório ou cria um fallback
          if [ ! -f "$DIR/index.html" ]; then
            FOUND_INDEX=$(find . -name "index.html" | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              cp "$FOUND_INDEX" "$DIR/index.html"
            else
              cat << 'EOF' > $DIR/index.html
          <!DOCTYPE html>
          <html lang="pt">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Runa Design Studio</title>
          </head>
          <body>
            <div id="root"></div>
          </body>
          </html>
          EOF
            fi
          fi

          # Garante o .htaccess para tratamento de rotas SPA
          cat << 'EOF' > $DIR/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Enviar para Hostinger via LFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          
          if [ -d ".output/public" ]; then
            DIR=".output/public"
          elif [ -d "dist" ]; then
            DIR="dist"
          else
            DIR="."
          fi

          lftp -c "
          set ftp:ssl-allow no;
          open -u ${{ secrets.FTP_USERNAME }},'${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};
          mirror --reverse --delete --verbose --no-perms ./$DIR/ /public_html/;
          quit;
          "
