name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar Build do Projeto
        run: npm run build

      - name: Enviar para Hostinger via LFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          
          # Detecta qual pasta de build foi gerada pelo Vite/Lovable
          if [ -d "dist" ]; then
            TARGET_DIR="dist"
          elif [ -d ".output/public" ]; then
            TARGET_DIR=".output/public"
          else
            TARGET_DIR="."
          fi

          echo "Pasta detectada para envio: $TARGET_DIR"

          lftp -c "
          set ftp:ssl-allow no;
          open -u ${{ secrets.FTP_USERNAME }},'${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};
          mirror --reverse --delete --verbose --no-perms ./$TARGET_DIR/ /public_html/;
          chmod -R 755 /public_html;
          find /public_html -type f -exec chmod 644 {} \;
          quit;
          "
