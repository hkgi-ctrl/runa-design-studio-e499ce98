name: Deploy Estático para Hostinger

on:
  push:
    branches:
      - main  # Ou o nome da sua branch padrão do Lovable

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-level: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build estático (Preset GitHub Pages)
        run: npx nitro build --preset github-pages

      - name: Sincronizar arquivos com a Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/  # Pasta que o comando gera com o index.html correto!
          server-dir: public_html/
