name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar Build do Projeto
        run: npm run build

      - name: Localizar e Injetar index.html e .htaccess
        run: |
          TARGET_DIR=".output/public"
          mkdir -p $TARGET_DIR

          # Procura qualquer index.html gerado na build (ignorando node_modules)
          PROCESSED_INDEX=$(find . -maxdepth 4 -name "index.html" ! -path "*/node_modules/*" ! -path "./index.html" | head -n 1)

          if [ -n "$PROCESSED_INDEX" ]; then
            echo "Index processado encontrado em: $PROCESSED_INDEX"
            cp "$PROCESSED_INDEX" $TARGET_DIR/index.html
          elif [ -f "index.html" ]; then
            echo "Usando index da raiz..."
            cp index.html $TARGET_DIR/index.html
          fi

          # Cria o .htaccess para suporte a SPA
          cat << 'EOF' > $TARGET_DIR/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Enviar para Hostinger via LFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          
          lftp -c "
          set ftp:ssl-allow no;
          open -u ${{ secrets.FTP_USERNAME }},'${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};
          mirror --reverse --delete --verbose --no-perms ./.output/public/ /public_html/;
          quit;
          "
