name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar Build do Projeto
        run: npm run build

      - name: Injetar index.html real e .htaccess
        run: |
          # Identifica a pasta de saída gerada pelo build
          if [ -d ".output/public" ]; then
            DIR=".output/public"
          elif [ -d "dist" ]; then
            DIR="dist"
          else
            DIR="."
          fi

          # Copia o index.html VERDADEIRO da raiz do repositório para a pasta de distribuição
          if [ -f "index.html" ]; then
            cp index.html $DIR/index.html
          fi

          # Cria o .htaccess para suporte a SPA
          cat << 'EOF' > $DIR/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Enviar para Hostinger via LFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          
          if [ -d ".output/public" ]; then
            DIR=".output/public"
          elif [ -d "dist" ]; then
            DIR="dist"
          else
            DIR="."
          fi

          lftp -c "
          set ftp:ssl-allow no;
          open -u ${{ secrets.FTP_USERNAME }},'${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};
          mirror --reverse --delete --verbose --no-perms ./$DIR/ /public_html/;
          quit;
          "
